name: A053067 pair correlations

on:
  push:
    branches:
      - research/a053067
    paths:
      - research/A053067/pair-correlation-request.env
      - research/A053067/pair_correlation_probe.py
      - research/A053067/congruence_families.py
      - research/A053067/local_product.py
      - .github/workflows/research-a053067-pair-correlations.yml

permissions:
  contents: read

jobs:
  correlations:
    if: github.repository == 'qazW12345/LeanFrontier' && github.ref == 'refs/heads/research/a053067'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Parse request
        shell: bash
        run: |
          set -euo pipefail
          request="research/A053067/pair-correlation-request.env"
          digits="$(awk -F= '$1 == "DIGITS" {print $2}' "$request" | tail -n 1 | tr -d '[:space:]')"
          bound="$(awk -F= '$1 == "PRIME_BOUND" {print $2}' "$request" | tail -n 1 | tr -d '[:space:]')"
          top="$(awk -F= '$1 == "TOP" {print $2}' "$request" | tail -n 1 | tr -d '[:space:]')"
          [[ "$digits" =~ ^[0-9]+$ ]]
          [[ "$bound" =~ ^[0-9]+$ ]]
          [[ "$top" =~ ^[0-9]+$ ]]
          echo "DIGITS=$digits" >> "$GITHUB_ENV"
          echo "PRIME_BOUND=$bound" >> "$GITHUB_ENV"
          echo "TOP=$top" >> "$GITHUB_ENV"

      - name: Measure exact pair correlations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/A053067/pair-correlation-run
          python3 research/A053067/pair_correlation_probe.py \
            --digits "$DIGITS" \
            --prime-bound "$PRIME_BOUND" \
            --top "$TOP" \
            --output research/A053067/pair-correlation-run/pairs.csv \
            | tee research/A053067/pair-correlation-run/summary.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: a053067-pair-correlations-${{ github.run_id }}
          path: research/A053067/pair-correlation-run/
          if-no-files-found: error
          retention-days: 90
