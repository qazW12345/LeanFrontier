name: A053067 parallel PRP search

on:
  push:
    branches:
      - research/a053067
    paths:
      - research/A053067/prp-matrix-request.env
      - research/A053067/search.cpp
      - research/A053067/analyze.py
      - .github/workflows/research-a053067-prp-matrix.yml

permissions:
  contents: read

concurrency:
  group: a053067-prp-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.repository == 'qazW12345/LeanFrontier' && github.ref == 'refs/heads/research/a053067'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]

    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install GMP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      - name: Parse request
        shell: bash
        run: |
          set -euo pipefail
          request=research/A053067/prp-matrix-request.env
          read_uint() {
            local key="$1"
            local value
            value="$(awk -F= -v key="$key" '$1 == key {print $2}' "$request" | tail -n 1 | tr -d '[:space:]')"
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "Invalid or missing $key" >&2
              exit 2
            fi
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            printf -v "$key" '%s' "$value"
          }
          read_uint START
          read_uint END
          read_uint SIEVE_BOUND
          read_uint PRP_REPS
          read_uint SHARD_COUNT
          read_uint THREADS
          if [[ "$SHARD_COUNT" -ne 8 ]]; then
            echo "This workflow currently expects SHARD_COUNT=8" >&2
            exit 2
          fi

      - name: Build searcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/A053067/prp-run
          g++ -O3 -march=native -std=c++20 -pthread \
            research/A053067/search.cpp -lgmpxx -lgmp \
            -o research/A053067/prp-run/a053067-search

      - name: Run PRP shard
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          OUT="research/A053067/prp-run/shard-${{ matrix.shard }}.csv"
          LOG="research/A053067/prp-run/shard-${{ matrix.shard }}.log"
          set +e
          research/A053067/prp-run/a053067-search \
            --start "$START" --end "$END" \
            --sieve-bound "$SIEVE_BOUND" \
            --prp-reps "$PRP_REPS" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "$SHARD_COUNT" \
            --threads "$THREADS" \
            --mode full \
            --output "$OUT" \
            2> >(tee "$LOG" >&2)
          rc=$?
          set -e
          if [[ "$rc" -eq 10 ]]; then
            echo "candidate=true" >> "$GITHUB_OUTPUT"
          elif [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          else
            echo "candidate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate shard
        shell: bash
        run: |
          set -euo pipefail
          python3 research/A053067/analyze.py \
            "research/A053067/prp-run/shard-${{ matrix.shard }}.csv" \
            --start "$START" --end "$END" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "$SHARD_COUNT" \
            --json-out "research/A053067/prp-run/manifest-${{ matrix.shard }}.json"

      - name: Record metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/A053067/prp-run
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "shard=${{ matrix.shard }}"
            echo "candidate=${{ steps.scan.outputs.candidate }}"
            echo
            sha256sum research/A053067/search.cpp research/A053067/analyze.py research/A053067/prp-matrix-request.env || true
          } > "research/A053067/prp-run/metadata-${{ matrix.shard }}.txt"

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a053067-prp-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: research/A053067/prp-run/
          if-no-files-found: error
          retention-days: 90
