name: validate-oci

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-oci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate on OCI
    runs-on: [self-hosted, Linux, ARM64, leanfrontier]
    timeout-minutes: 30
    env:
      TRUSTED_REF: f61ae6b17c51b0b5ed80ab11ea0e876225edc661
      CANDIDATE_REF: cdde64f72811e9d17a433368379910147f999cc6
      RUN_ROOT: ${{ github.workspace }}/validation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out trusted receiver revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TRUSTED_REF }}
          path: validation-${{ github.run_id }}-${{ github.run_attempt }}/trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out untrusted candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: validation-${{ github.run_id }}-${{ github.run_attempt }}/candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Trusted cheap preflight
        run: >-
          python3 "$RUN_ROOT/trusted/tools/validate-submission"
          --base-dir "$RUN_ROOT/trusted"
          --candidate-dir "$RUN_ROOT/candidate"
          --preflight-only
          --json-out "$RUN_ROOT/preflight-report.json"

      - name: Build trusted validation image
        run: >-
          docker build
          -f "$RUN_ROOT/trusted/tools/Dockerfile.validator"
          -t leanfrontier-validator:ci
          "$RUN_ROOT/trusted"

      - name: Fetch pinned dependencies and compiled Mathlib cache
        run: |
          mkdir -p "$RUN_ROOT/elan"
          for attempt in 1 2 3; do
            docker run --rm \
              -v "$RUN_ROOT/elan:/elan" \
              -v "$RUN_ROOT/candidate:/candidate" \
              -w /candidate \
              leanfrontier-validator:ci sh -c 'lake update && lake exe cache get' && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Restricted formal validation
        run: |
          mkdir -p "$RUN_ROOT/report-output"
          chmod 0777 "$RUN_ROOT/report-output"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 2g --cpus 2 --pids-limit 512 \
            --tmpfs /tmp:size=2g \
            -v "$RUN_ROOT/elan:/elan:ro" \
            -v "$RUN_ROOT/trusted:/trusted:ro" \
            -v "$RUN_ROOT/candidate:/candidate:ro" \
            -v "$RUN_ROOT/candidate/.lake:/candidate/.lake" \
            -v "$RUN_ROOT/report-output:/report-output" \
            -w /candidate \
            -e PYTHONPATH=/trusted/tools \
            leanfrontier-validator:ci \
            python3 /trusted/tools/validate-submission \
            --base-dir /trusted --candidate-dir /candidate \
            --json-out /report-output/report.json

      - name: Upload receiver report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leanfrontier-validation-report
          path: |
            ${{ env.RUN_ROOT }}/preflight-report.json
            ${{ env.RUN_ROOT }}/report-output/report.json
          if-no-files-found: warn
