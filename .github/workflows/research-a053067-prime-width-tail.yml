name: A053067 prime-width tail probe

on:
  push:
    branches:
      - research/a053067
    paths:
      - research/A053067/prime-width-tail-request.env
      - research/A053067/prime_width_tail.cpp
      - .github/workflows/research-a053067-prime-width-tail.yml

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'qazW12345/LeanFrontier' && github.ref == 'refs/heads/research/a053067'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Parse request
        shell: bash
        run: |
          set -euo pipefail
          request=research/A053067/prime-width-tail-request.env
          read_uint() {
            local key="$1"
            local value
            value="$(awk -F= -v key="$key" '$1 == key {print $2}' "$request" | tail -n 1 | tr -d '[:space:]')"
            [[ "$value" =~ ^[0-9]+$ ]]
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          }
          read_uint MAX_P
          read_uint MAX_D

      - name: Build probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/A053067/prime-width-tail-run
          g++ -O3 -march=native -std=c++20 \
            research/A053067/prime_width_tail.cpp \
            -o research/A053067/prime-width-tail-run/probe

      - name: Run probe
        shell: bash
        run: |
          set -euo pipefail
          research/A053067/prime-width-tail-run/probe \
            --max-p "$MAX_P" \
            --max-d "$MAX_D" \
            --output research/A053067/prime-width-tail-run/tail.csv \
            2> >(tee research/A053067/prime-width-tail-run/summary.txt >&2)

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: a053067-prime-width-tail-${{ github.run_id }}
          path: research/A053067/prime-width-tail-run/
          if-no-files-found: error
          retention-days: 90
