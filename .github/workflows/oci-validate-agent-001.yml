name: oci-validate-agent-001

on:
  push:
    branches:
      - ci/oci-agent-001

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, ARM64, leanfrontier]
    timeout-minutes: 30
    env:
      TRUSTED_REF: f61ae6b17c51b0b5ed80ab11ea0e876225edc661
      CANDIDATE_REF: cdde64f72811e9d17a433368379910147f999cc6
    steps:
      - name: Check out trusted receiver revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TRUSTED_REF }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out untrusted candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Trusted cheap preflight
        run: >-
          python3 trusted/tools/validate-submission
          --base-dir "$GITHUB_WORKSPACE/trusted"
          --candidate-dir "$GITHUB_WORKSPACE/candidate"
          --preflight-only
          --json-out "$GITHUB_WORKSPACE/preflight-report.json"

      - name: Build trusted validation image
        run: docker build -f trusted/tools/Dockerfile.validator -t leanfrontier-validator:ci trusted

      - name: Fetch pinned dependencies and compiled Mathlib cache
        run: |
          for attempt in 1 2 3; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE/elan:/elan" \
              -v "$GITHUB_WORKSPACE/candidate:/candidate" \
              -w /candidate \
              leanfrontier-validator:ci sh -c 'lake update && lake exe cache get' && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Restricted formal validation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/report-output"
          chmod 0777 "$GITHUB_WORKSPACE/report-output"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 2g --cpus 2 --pids-limit 512 \
            --tmpfs /tmp:size=2g \
            -v "$GITHUB_WORKSPACE/elan:/elan:ro" \
            -v "$GITHUB_WORKSPACE/trusted:/trusted:ro" \
            -v "$GITHUB_WORKSPACE/candidate:/candidate:ro" \
            -v "$GITHUB_WORKSPACE/candidate/.lake:/candidate/.lake" \
            -v "$GITHUB_WORKSPACE/report-output:/report-output" \
            -w /candidate \
            -e PYTHONPATH=/trusted/tools \
            leanfrontier-validator:ci \
            python3 /trusted/tools/validate-submission \
            --base-dir /trusted --candidate-dir /candidate \
            --json-out /report-output/report.json

      - name: Upload receiver report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leanfrontier-validation-report
          path: |
            preflight-report.json
            report-output/report.json
          if-no-files-found: warn
