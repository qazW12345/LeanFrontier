name: A053067 research scan

on:
  workflow_dispatch:
    inputs:
      start:
        description: First n to test
        required: true
        default: "1001"
      end:
        description: Last n to test
        required: true
        default: "10000"
      sieve_bound:
        description: Trial-prime sieve bound
        required: true
        default: "200000"
      prp_reps:
        description: GMP probable-prime repetitions
        required: true
        default: "25"
      shard_index:
        description: Zero-based shard index
        required: true
        default: "0"
      shard_count:
        description: Total number of shards
        required: true
        default: "1"
  push:
    branches:
      - research/a053067
    paths:
      - research/A053067/run-request.env

permissions:
  contents: read

concurrency:
  group: a053067-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/research/a053067'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1440

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/a053067

      - name: Resolve run configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "START=${{ inputs.start }}"
              echo "END=${{ inputs.end }}"
              echo "SIEVE_BOUND=${{ inputs.sieve_bound }}"
              echo "PRP_REPS=${{ inputs.prp_reps }}"
              echo "SHARD_INDEX=${{ inputs.shard_index }}"
              echo "SHARD_COUNT=${{ inputs.shard_count }}"
            } >> "$GITHUB_ENV"
          else
            set -a
            source research/A053067/run-request.env
            set +a
            for name in START END SIEVE_BOUND PRP_REPS SHARD_INDEX SHARD_COUNT; do
              value="${!name:-}"
              test -n "$value" || { echo "Missing $name in run-request.env" >&2; exit 2; }
              echo "$name=$value" >> "$GITHUB_ENV"
            done
          fi

      - name: Check runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v g++ >/dev/null
          command -v python3 >/dev/null
          test -f /usr/include/gmpxx.h || {
            echo "Missing GMP C++ development headers (install libgmp-dev)." >&2
            exit 2
          }

      - name: Build searcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/A053067/build
          g++ -O3 -march=native -std=c++20             research/A053067/search.cpp -lgmpxx -lgmp             -o research/A053067/build/a053067-search

      - name: Verify implementation and checked-in pilot
        shell: bash
        run: |
          set -euo pipefail
          python3 research/A053067/verify.py

      - name: Run scan
        id: scan
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p research/A053067/run
          OUT="research/A053067/run/scan-${START}-${END}-shard-${SHARD_INDEX}-of-${SHARD_COUNT}.csv"
          LOG="research/A053067/run/scan-${START}-${END}-shard-${SHARD_INDEX}-of-${SHARD_COUNT}.log"

          set +e
          research/A053067/build/a053067-search             --start "$START"             --end "$END"             --sieve-bound "$SIEVE_BOUND"             --prp-reps "$PRP_REPS"             --shard-index "$SHARD_INDEX"             --shard-count "$SHARD_COUNT"             --output "$OUT" 2>"$LOG"
          RC=$?
          set -e

          cat "$LOG"

          if [ "$RC" -eq 10 ]; then
            echo "candidate=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A053067 probable-prime candidate found; inspect the artifact."
          elif [ "$RC" -ne 0 ]; then
            exit "$RC"
          else
            echo "candidate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          files = sorted(Path("research/A053067/run").glob("scan-*.csv"))
          for path in files:
              rows = list(csv.DictReader(path.open()))
              counts = Counter(row["status"] for row in rows)
              print(path.name, dict(counts))
              candidates = [row for row in rows if row["status"] == "probable_prime"]
              if candidates:
                  print("probable-prime candidates:", candidates)
          PY

      - name: Upload scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: a053067-${{ github.run_id }}
          path: research/A053067/run/
          if-no-files-found: error
          retention-days: 90
