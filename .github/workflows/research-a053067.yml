name: A053067 research scan

on:
  workflow_dispatch:
    inputs:
      start:
        description: First n to test
        required: true
        default: "3001"
      end:
        description: Last n to test
        required: true
        default: "5000"
      sieve_bound:
        description: Trial-prime sieve bound
        required: true
        default: "1000000"
      prp_reps:
        description: GMP probable-prime repetitions
        required: true
        default: "25"
      shard_index:
        description: Zero-based shard index
        required: true
        default: "0"
      shard_count:
        description: Total number of shards
        required: true
        default: "1"
      threads:
        description: Worker threads; 0 means hardware concurrency
        required: true
        default: "0"
  push:
    branches:
      - research/a053067
    paths:
      - research/A053067/run-request.env
      - research/A053067/search.cpp
      - research/A053067/verify.py
      - research/A053067/analyze.py
      - .github/workflows/research-a053067.yml

permissions:
  contents: read

concurrency:
  group: a053067-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.repository == 'qazW12345/LeanFrontier' && github.ref == 'refs/heads/research/a053067'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1440

    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve and validate run configuration
        shell: bash
        run: |
          set -euo pipefail

          write_uint() {
            local key="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "Invalid numeric value for $key: $value" >&2
              exit 2
            fi
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            write_uint START "${{ inputs.start }}"
            write_uint END "${{ inputs.end }}"
            write_uint SIEVE_BOUND "${{ inputs.sieve_bound }}"
            write_uint PRP_REPS "${{ inputs.prp_reps }}"
            write_uint SHARD_INDEX "${{ inputs.shard_index }}"
            write_uint SHARD_COUNT "${{ inputs.shard_count }}"
            write_uint THREADS "${{ inputs.threads }}"
          else
            request=research/A053067/run-request.env
            read_uint() {
              local key="$1"
              local value
              value="$(awk -F= -v key="$key" '$1 == key {print $2}' "$request" | tail -n 1 | tr -d '[:space:]')"
              write_uint "$key" "$value"
            }
            read_uint START
            read_uint END
            read_uint SIEVE_BOUND
            read_uint PRP_REPS
            read_uint SHARD_INDEX
            read_uint SHARD_COUNT
            read_uint THREADS
          fi

      - name: Check runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          python3 --version
          printf '#include <gmpxx.h>\nint main(){ mpz_class x = 23; return x == 23 ? 0 : 1; }\n' \
            | g++ -x c++ -std=c++20 - -lgmpxx -lgmp -o /tmp/a053067-gmp-check
          /tmp/a053067-gmp-check

      - name: Build searcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/A053067/run
          g++ -O3 -march=native -std=c++20 -pthread \
            research/A053067/search.cpp -lgmpxx -lgmp \
            -o research/A053067/run/a053067-search

      - name: Verify implementation and checked-in evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 research/A053067/verify.py

      - name: Run scan
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          OUT="research/A053067/run/scan-${START}-${END}-shard-${SHARD_INDEX}-of-${SHARD_COUNT}.csv"
          LOG="research/A053067/run/scan-${START}-${END}-shard-${SHARD_INDEX}-of-${SHARD_COUNT}.log"

          set +e
          research/A053067/run/a053067-search \
            --start "$START" \
            --end "$END" \
            --sieve-bound "$SIEVE_BOUND" \
            --prp-reps "$PRP_REPS" \
            --shard-index "$SHARD_INDEX" \
            --shard-count "$SHARD_COUNT" \
            --threads "$THREADS" \
            --output "$OUT" \
            2> >(tee "$LOG" >&2)
          RC=$?
          set -e

          if [ "$RC" -eq 10 ]; then
            echo "candidate=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A053067 probable-prime candidate found; inspect the artifact."
            {
              echo "### Probable-prime candidate detected"
              grep ',probable_prime,' "$OUT" || true
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RC" -ne 0 ]; then
            exit "$RC"
          else
            echo "candidate=false" >> "$GITHUB_OUTPUT"
            echo "### No probable-prime candidate in this shard" >> "$GITHUB_STEP_SUMMARY"
          fi

          tail -n 1 "$LOG" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Validate scan evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find research/A053067/run -maxdepth 1 -name 'scan-*.csv' -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No scan CSV was produced." >&2
            exit 2
          fi
          python3 research/A053067/analyze.py "${files[@]}" \
            --start "$START" --end "$END" \
            --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" \
            --json-out research/A053067/run/manifest.json

      - name: Record reproducibility metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/A053067/run
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "start=${START:-unset}"
            echo "end=${END:-unset}"
            echo "sieve_bound=${SIEVE_BOUND:-unset}"
            echo "prp_reps=${PRP_REPS:-unset}"
            echo "shard_index=${SHARD_INDEX:-unset}"
            echo "shard_count=${SHARD_COUNT:-unset}"
            echo "threads=${THREADS:-unset}"
            echo "candidate=${{ steps.scan.outputs.candidate }}"
            echo
            uname -a || true
            g++ --version | head -n 1 || true
            python3 --version || true
            sha256sum research/A053067/search.cpp research/A053067/verify.py research/A053067/analyze.py research/A053067/run-request.env || true
          } > research/A053067/run/metadata.txt

      - name: Summarize result classes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          for path in sorted(Path("research/A053067/run").glob("scan-*.csv")):
              rows = list(csv.DictReader(path.open()))
              counts = Counter(row["status"] for row in rows)
              print(path.name, dict(counts))
              candidates = [row for row in rows if row["status"] == "probable_prime"]
              if candidates:
                  print("probable-prime candidates:", candidates)
          PY

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a053067-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/A053067/run/
          if-no-files-found: error
          retention-days: 90
